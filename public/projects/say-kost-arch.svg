<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" fill="none">
  <rect width="1100" height="620" rx="16" fill="#f8fafc"/>
  <rect x="16" y="16" width="1068" height="588" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>

  <defs>
    <marker id="arrowKost" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <text x="550" y="56" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Say-Kost App — Boarding House System Architecture</text>

  <!-- Role Auth (Top Left) -->
  <rect x="150" y="92" width="230" height="84" rx="10" fill="#fef3c7" stroke="#1e293b" stroke-width="2"/>
  <text x="265" y="130" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Role-Based Auth</text>
  <text x="265" y="154" font-family="JetBrains Mono, monospace" font-size="12" fill="#334155" text-anchor="middle">(Admin &amp; Customer Roles)</text>

  <!-- Java Desktop GUI (Left) -->
  <rect x="70" y="250" width="190" height="140" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/>
  <rect x="125" y="280" width="80" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <line x1="125" y1="294" x2="205" y2="294" stroke="#1e293b" stroke-width="2"/>
  <text x="165" y="420" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Java NetBeans GUI</text>
  <text x="165" y="442" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">(Desktop Views)</text>

  <!-- Unified Java NetBeans Application Repository (Center) -->
  <rect x="400" y="180" width="280" height="270" rx="14" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
  <text x="656" y="212" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="end">Java NetBeans App</text>

  <rect x="445" y="265" width="190" height="100" rx="10" fill="#dcfce7" stroke="#1e293b" stroke-width="2"/>
  <text x="540" y="312" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="800" fill="#0f172a" text-anchor="middle">Java Backend</text>
  <text x="540" y="338" font-family="JetBrains Mono, monospace" font-size="12" fill="#334155" text-anchor="middle">Booking &amp; Admin Logic</text>

  <!-- MySQL Rooms & Inventory (Top Right) -->
  <rect x="810" y="125" width="210" height="130" rx="12" fill="#f3e8ff" stroke="#1e293b" stroke-width="2"/>
  <ellipse cx="915" cy="162" rx="28" ry="10" fill="#e9d5ff" stroke="#1e293b" stroke-width="2"/>
  <path d="M 887 162 V 202 C 887 208 943 208 943 202 V 162" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="915" y="236" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">MySQL Database</text>
  <text x="915" y="276" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="middle">(Rooms, Users &amp; Pricing)</text>

  <!-- Transaction Ledger (Bottom Right) -->
  <rect x="810" y="335" width="210" height="130" rx="12" fill="#ffedd5" stroke="#1e293b" stroke-width="2"/>
  <rect x="885" y="362" width="60" height="48" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <line x1="895" y1="378" x2="935" y2="378" stroke="#1e293b" stroke-width="2"/>
  <line x1="895" y1="392" x2="925" y2="392" stroke="#1e293b" stroke-width="2"/>
  <text x="915" y="442" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Transaction Ledger</text>
  <text x="915" y="486" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="middle">(Reservations &amp; History)</text>

  <!-- Arrows -->
  <line x1="185" y1="250" x2="235" y2="180" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrowKost)"/>
  <line x1="260" y1="315" x2="440" y2="315" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrowKost)"/>
  <text x="350" y="303" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Events / Controllers</text>

  <line x1="635" y1="295" x2="804" y2="195" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrowKost)"/>
  <line x1="635" y1="335" x2="804" y2="400" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrowKost)"/>
  <text x="720" y="226" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">JDBC</text>
</svg>
