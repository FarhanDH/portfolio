  <text x="312" y="428" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#10b981">LANI AI · GEMINI + GROQ ENGINE</text>
  <text x="312" y="456" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#f8fafc">1. Apply Urea + NPK Phonska (15-15-15) at 150 kg/ha.</text>
  <text x="312" y="482" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#f8fafc">2. Maintain standing water depth at 3-5 cm for 4 days.</text>
