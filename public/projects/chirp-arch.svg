<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" fill="none">
  <rect width="1100" height="620" rx="16" fill="#f8fafc"/>
  <rect x="16" y="16" width="1068" height="588" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>

  <defs>
    <marker id="arrowChirp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <text x="550" y="56" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Chirp API — Social Graph &amp; Media Architecture</text>

  <!-- Web Client (Left) -->
  <rect x="70" y="250" width="190" height="140" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/>
  <rect x="125" y="280" width="80" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <line x1="125" y1="294" x2="205" y2="294" stroke="#1e293b" stroke-width="2"/>
  <text x="165" y="420" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Chirp Web Client</text>
  <text x="165" y="442" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">(Guests &amp; Creators)</text>

  <!-- NestJS Backend Container (Center) -->
  <rect x="400" y="180" width="280" height="270" rx="14" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
  <text x="656" y="212" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="end">Backend Service</text>

  <rect x="445" y="265" width="190" height="100" rx="10" fill="#dcfce7" stroke="#1e293b" stroke-width="2"/>
  <text x="540" y="312" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">Chirp API</text>
  <text x="540" y="338" font-family="JetBrains Mono, monospace" font-size="12" fill="#334155" text-anchor="middle">NestJS + TypeScript</text>

  <!-- PostgreSQL DB (Top Right) -->
  <rect x="810" y="125" width="210" height="130" rx="12" fill="#f3e8ff" stroke="#1e293b" stroke-width="2"/>
  <ellipse cx="915" cy="162" rx="28" ry="10" fill="#e9d5ff" stroke="#1e293b" stroke-width="2"/>
  <path d="M 887 162 V 202 C 887 208 943 208 943 202 V 162" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="915" y="236" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">PostgreSQL DB</text>
  <text x="915" y="276" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="middle">(Posts, Likes, Comments)</text>

  <!-- AWS S3 Bucket (Bottom Right) -->
  <rect x="810" y="335" width="210" height="130" rx="12" fill="#ffedd5" stroke="#1e293b" stroke-width="2"/>
  <path d="M 892 365 L 938 365 L 930 412 L 900 412 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="915" y="442" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">AWS S3 Bucket</text>
  <text x="915" y="486" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="middle">(Post Media Uploads)</text>

  <!-- Arrows -->
  <line x1="260" y1="315" x2="440" y2="315" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrowChirp)"/>
  <text x="350" y="303" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">HTTPS / REST</text>

  <line x1="635" y1="295" x2="804" y2="195" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrowChirp)"/>
  <line x1="635" y1="335" x2="804" y2="400" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrowChirp)"/>
</svg>
